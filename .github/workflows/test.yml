name: Test migration script

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check and CLI smoke test
        run: |
          python -m py_compile scripts/migrate_ultimatehomes.py tests/test_migrate_ultimatehomes.py
          python scripts/migrate_ultimatehomes.py --help >/dev/null
          python -c "import yaml; data = yaml.safe_load(open('migration.example.yml', encoding='utf-8')); assert isinstance(data, dict)"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
